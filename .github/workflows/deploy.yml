name: Deploy to GCP

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check generated types are in sync
        run: python3 sahyog/scripts/gen_ts_types.py --check

      - name: Build volunteer SPA
        run: |
          cd sahyog/static/src/volunteer_app
          npm ci
          npm test          # Vitest unit tests (fast, no Odoo needed)
          npm run build

      - name: Build PR SPA
        run: |
          cd isha_pr/static/src/pr_app
          npm ci
          npm run build

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.GCP_SSH_KEY }}

      - name: Deploy to server
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          ssh-keyscan -H $SERVER_IP >> ~/.ssh/known_hosts 2>/dev/null

          # Sync code from the runner's checkout (the VM is a plain checkout,
          # not a git clone). --delete mirrors the tree; excludes keep the VM's
          # secrets (.env), Docker volumes, built dist (synced below), and deps.
          rsync -avz --delete \
            --exclude='.git' --exclude='node_modules' --exclude='.env' \
            --exclude='static/dist' --exclude='pgdata' --exclude='odoo-filestore' \
            ./ $SERVER_USER@$SERVER_IP:/home/gauravrana/sahyog-odoo/

          # Copy the built SPA dists (not in git)
          rsync -avz --chmod=D755,F644 \
            sahyog/static/dist/ \
            $SERVER_USER@$SERVER_IP:/tmp/sahyog-dist/
          rsync -avz --chmod=D755,F644 \
            isha_pr/static/dist/ \
            $SERVER_USER@$SERVER_IP:/tmp/pr-dist/

          # Move built files into place, upgrade both modules, restart
          ssh $SERVER_USER@$SERVER_IP "sudo bash -c '
            mkdir -p /home/gauravrana/sahyog-odoo/sahyog/static/dist
            mkdir -p /home/gauravrana/sahyog-odoo/isha_pr/static/dist
            cp -r /tmp/sahyog-dist/* /home/gauravrana/sahyog-odoo/sahyog/static/dist/
            cp -r /tmp/pr-dist/* /home/gauravrana/sahyog-odoo/isha_pr/static/dist/
            rm -rf /tmp/sahyog-dist /tmp/pr-dist
            cd /home/gauravrana/sahyog-odoo
            # -i installs new modules on first deploy (no-op once installed); -u upgrades all thereafter
            docker compose run --rm odoo odoo -d sahyog -i isha_pr,web_column_width_local -u sahyog,isha_pr,web_column_width_local --stop-after-init
            # up -d (not restart) so the serving container picks up new volume mounts + port/conf changes
            docker compose up -d odoo
            # reload nginx so security/config changes to nginx/sahyog.conf take effect
            docker compose restart nginx
          '"
