[options]
addons_path = /mnt/extra-addons
data_dir = /var/lib/odoo
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo
db_name = sahyog
proxy_mode = true

; ── Production tuning (P3.2) ──
; Prefork workers so SPA API traffic and the Odoo backend don't contend on a
; single process. Rule of thumb: workers ≈ (2 × CPU cores) + 1; tune to the VM.
workers = 2
max_cron_threads = 1
; Recycle a worker if a single request exceeds these (seconds / bytes).
limit_time_cpu = 120
limit_time_real = 240
limit_request = 8192
limit_memory_soft = 2147483648
limit_memory_hard = 2684354560
